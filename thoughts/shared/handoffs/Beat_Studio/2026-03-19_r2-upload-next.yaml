decisions:
  - skyreels_v3_winner: SkyReels V3 is the production video backend
  - r2_for_large_clips: Cloudflare R2 upload in worker to bypass 10MB payload limit
  - multi_clip_no_loop: Scenes split into equal sub-clips ≤8s, no looping, clips_per_scene tracks grouping

findings:
  - runpod_payload_limit: ~10MB max. Base64 overhead = raw_size × 1.37. Safe limit = ~7.3MB raw video.
  - v3_generation_rate: ~3 min/sec of video at 480P on A100 (warm). 5s = ~15 min, 7s = ~25 min.
  - wan22_never_ran: model_index.json still missing from /runpod-volume/models/Wan2.2-I2V-A14B

