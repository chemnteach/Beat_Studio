goal: Implement Cloudflare R2 upload in RunPod worker so clips >~4s can be returned without hitting the 10MB payload limit

now: |
  SkyReels V3 selected as production backend. Multi-clip strategy implemented in router/assembler.
  Blocker: RunPod serverless ~10MB output payload limit breaks 7s V3 clips (~24MB base64).
  Solution agreed: worker uploads MP4 to R2, returns URL; backend downloads from URL.

context: |
  RunPod serverless caps response payload at ~10MB. SkyReels V3 produces:
    3s clip → ~7.6MB raw → ~10MB base64 (barely fits, worked in comparison runs)
    7s clip → ~18MB raw → ~24MB base64 (silently dropped — COMPLETED with no output key)

  The worker runs generate_video.py subprocess, reads the .mp4 file, base64-encodes it,
  and returns it in the JSON response body. This needs to change to:
    1. Worker generates MP4 to temp file (unchanged)
    2. Worker uploads MP4 bytes to Cloudflare R2 using boto3 (S3-compatible)
    3. Worker returns {"video_url": "https://...", "model": ..., "duration_sec": ..., ...}
    4. Backend (runpod_client.py) downloads from video_url instead of base64-decoding
    5. Worker deletes the R2 object after confirmed download (or set 1-day TTL)

  All other models (FramePack, WAN 2.2) produce much smaller files and may not need R2,
  but implement R2 for all models to be consistent and future-proof.

