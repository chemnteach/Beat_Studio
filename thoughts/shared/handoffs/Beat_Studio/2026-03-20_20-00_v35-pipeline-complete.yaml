decisions:
  - generator_vs_return: RunPod serverless standard endpoints do NOT capture generator yields.
      Handler must be a regular function returning a single dict. Use print() for progress logging.
  - hf_cache_on_volume: HF_HOME must point to /runpod-volume/hf_cache, not /workspace/hf_cache.
      Container disk is 20GB; SkyReels-V3-Reference2Video is 28GB — must go to network volume.
  - kijai_fp8_unusable: ComfyUI-format FP8 safetensors from Kijai/WanVideo_comfy_fp8_scaled are
      incompatible with SkyReels-V3 generate_video.py. Use --low_vram for equivalent VRAM savings.
  - tf32_no_benefit: TF32 provides no speedup when model runs with FP8 quantization (--low_vram).
      Kept in code (harmless) but not a viable optimization lever for this workload.

findings:
  - generate_video_py_args: Script accepts --low_vram (FP8 quant + block offload), --offload
      (CPU offload), --use_usp (multi-GPU). MODEL_ID_CONFIG maps task_type to correct HF repo IDs.
  - model_warm_cache: After first 28GB download, subsequent jobs run ~19 min (1138s for 5s clip,
      1570s for 7s clip). Cold start (first run ever) was 1570s including download.
  - ref_images_arg_format: generate_video.py receives --ref_imgs as comma-separated paths.
      models.py passes [primary_path] + ref_paths, joined with commas, max 4 total.

