questions:
  - Bridge at GT 160-190s is inside pipeline section [132.8-170.5s] which spans both GT pre_chorus and bridge. The novelty curve isn't placing a boundary at 160s. Need to understand why.
  - "old man" wins over "island girl" as hook (3 vs 2 sections). Both are valid repeated phrases in the song. Is this the right signal or should title-word phrases get priority?

decisions:
  - hook_selection_max_sections: Hook = phrase in most distinct inner sections, tie-break by phrase length then lexicographic. No special handling for song title words.
  - stop_word_list_inline: Used a hardcoded minimal stop word list (no NLTK dependency) — ~50 common function words + interjections.
  - bridge_condition: bridge fires when section is between two choruses AND has no hook AND energy < median chorus energy.

findings:
  - hook_phrase_works_mechanically: relabel_by_hook_phrase correctly identifies the repeated phrase and promotes sections. For Island Girl, "old man" (3 sections) beats "island girl" (2 sections).
  - boundary_is_the_bottleneck: All type-label mismatches in Island Girl are caused by boundary placement, not label logic. The 6/7 GT inner boundaries within 10s score is unchanged by hook phrase pass.
  - pre_chorus_140_160_regressed: That GT pre_chorus section (140-160s) mapped to pipeline pre_chorus [132.8-170.5s] before hook pass; after hook pass, [132.8-170.5s] became chorus (contains "old man"). Net: one correct-type match lost.
  - bridge_not_detectable_from_current_boundaries: The GT bridge [160-190s] falls inside a single pipeline section [132.8-170.5s] that also spans GT pre_chorus. Can't relabel half a section. Need tighter boundaries.

