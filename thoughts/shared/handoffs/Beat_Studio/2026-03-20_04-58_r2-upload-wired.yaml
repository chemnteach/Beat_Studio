  - task: Fixed SigV4 signing issue (v24)
    files: [runpod_worker/src/handler.py]
    notes: |
      First test attempt (v23) produced 168 frames / 16.5MB but failed with
      "400 Bad Request on job-done callback" — R2 was rejecting put_object due to
      wrong signature version. Added Config(signature_version="s3v4") to boto3 client.

decisions:
  - r2_sigv4_required: Cloudflare R2 requires explicit SigV4 signing; boto3 with
      region_name="auto" alone is not sufficient — must pass Config(signature_version="s3v4")
  - error_truncation: R2 error messages truncated to 500 chars in handler return to prevent
      RunPod result payload from growing large with boto3 stack traces

findings:
  - v23_cold_start: First v23 run sat IN_QUEUE for 45 min and timed out — likely worker
      crash on startup or image pull issue; endpoint showed workers never became available
  - v23_400_on_r2: Second run (after endpoint confirm) — video generated successfully
      (168 frames, 16.5MB) but got 400 from R2 on put_object due to missing SigV4 config
  - r2_env_vars: R2_ACCOUNT_ID in .env is the full endpoint URL including https://
      (https://87f8328f074f743b2b2477f130954593.r2.cloudflarestorage.com), not just the account ID

